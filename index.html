<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Music Service Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    select, input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      font-size: 15px;
    }

    select, input {
      background: #333;
      color: #fff;
    }

    button {
      background: #1db954;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #18a347;
    }

    #randomBtn {
      background: #ff4757;
      font-weight: bold;
    }

    #randomBtn:hover {
      background: #e84141;
    }

    .results {
      margin-top: 20px;
      text-align: left;
    }

    .video-item {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
    }

    .video-item:hover {
      background: #3a3a3a;
    }

    iframe {
      margin-top: 20px;
      width: 100%;
      height: 315px;
      border-radius: 10px;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Music Service Game</h1>

    <label>Choose a service:</label>
    <select id="service">
      <option value="spotify">Spotify</option>
      <option value="apple">Apple Music</option>
      <option value="ytmusic">YouTube Music</option>
    </select>

    <label>Search for a song:</label>
    <input type="text" id="searchInput" placeholder="Type a song or artist...">

    <button onclick="searchYouTube()">Search</button>
    <button id="randomBtn" onclick="randomSong()">Random Song</button>

    <div class="results" id="results"></div>

    <iframe id="player" style="display:none;"></iframe>
  </div>

  <script>
    function searchYouTube() {
      const query = document.getElementById("searchInput").value;
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "Searching...";

      fetch(`https://corsproxy.io/?https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`)
        .then(res => res.text())
        .then(html => {
          resultsDiv.innerHTML = "";

          const videoIds = [...html.matchAll(/"videoId":"(.*?)"/g)].map(m => m[1]);

          videoIds.slice(0, 10).forEach(id => {
            const item = document.createElement("div");
            item.className = "video-item";
            item.innerHTML = `
              <img src="https://img.youtube.com/vi/${id}/default.jpg">
              <div><strong>Video ID: ${id}</strong></div>
            `;
            item.onclick = () => playVideo(id);
            resultsDiv.appendChild(item);
          });
        });
    }

    function randomSong() {
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "Loading random song...";

      fetch(`https://corsproxy.io/?https://www.youtube.com/feed/trending`)
        .then(res => res.text())
        .then(html => {
          const videoIds = [...html.matchAll(/"videoId":"(.*?)"/g)].map(m => m[1]);

          if (videoIds.length === 0) {
            resultsDiv.innerHTML = "Could not load random song.";
            return;
          }

          const randomId = videoIds[Math.floor(Math.random() * videoIds.length)];
          playVideo(randomId);

          resultsDiv.innerHTML = `<strong>Random Song Loaded!</strong>`;
        });
    }

    function playVideo(id) {
      const player = document.getElementById("player");
      player.style.display = "block";
      player.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
    }
  </script>

</body>
</html>
