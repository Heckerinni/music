<script>
  function searchYouTube() {
    const query = document.getElementById("searchInput").value;
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "Searching...";

    fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent("https://www.youtube.com/results?search_query=" + query)}`)
      .then(res => res.text())
      .then(html => {
        resultsDiv.innerHTML = "";

        const videoIds = [...html.matchAll(/"videoId":"(.*?)"/g)].map(m => m[1]);

        videoIds.slice(0, 10).forEach(id => {
          const item = document.createElement("div");
          item.className = "video-item";
          item.innerHTML = `
            <img src="https://img.youtube.com/vi/${id}/default.jpg">
            <div><strong>Video ID: ${id}</strong></div>
          `;
          item.onclick = () => playVideo(id);
          resultsDiv.appendChild(item);
        });
      });
  }

  function randomSong() {
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "Loading random song...";

    fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent("https://www.youtube.com/feed/trending")}`)
      .then(res => res.text())
      .then(html => {
        const videoIds = [...html.matchAll(/"videoId":"(.*?)"/g)].map(m => m[1]);

        if (videoIds.length === 0) {
          resultsDiv.innerHTML = "Could not load random song.";
          return;
        }

        const randomId = videoIds[Math.floor(Math.random() * videoIds.length)];
        playVideo(randomId);

        resultsDiv.innerHTML = `<strong>Random Song Loaded!</strong>`;
      });
  }

  function playVideo(id) {
    const player = document.getElementById("player");
    player.style.display = "block";
    player.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
  }
</script>
